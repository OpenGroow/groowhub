schemaVersion: 1
category: system
# OpenGroow's own read-only MCP (ADR-080): no url, no other server next to it.
mcpServers:
  - name: opengroow
    transport: streamable-http
    internal:
      tools:
        - get_strategic_memory
        - get_analytics_summary
        - list_publications
        - list_production_recipes
        - get_brand_core
        - list_mission_types
        - list_sources
        - list_planned_contents
        - list_generation_sources
        - get_source
        - get_production_recipe
contextProviders:
  - strategic-review-period
  - content-planning-targets
jobTypes:
  - type: strategic_review
    agentsMd: jobs/strategic-review.md
  - type: content_planning
    agentsMd: jobs/content-planning.md
