name: Release

# Releases a package when a merge to main changes its version: no tag to push,
# no second PR. For every package whose index entry does not point at its
# current version (tools/pending-releases.mjs), it builds the package, creates
# the tag and the GitHub Release on the merged commit, then writes the new tag,
# asset and digest into the index and commits it to main.
#
#   Templates   packages/<name>             tag <name>@<version>            index.json
#   Publishers  packages/publisher/<id>     tag publisher-<id>@<version>    publishers.json
#
# The human gate is the reviewed PR that bumps the version: that merge decides
# what installs on users' deployments. The first index entry of a package (and
# its trust level) is still added by a maintainer in a reviewed PR; a package
# without one is skipped.
#
# It acts as a GitHub App (vars.RELEASE_APP_ID, secrets.RELEASE_APP_PRIVATE_KEY)
# because the index commit must bypass the "Protect main" ruleset: the App is
# that ruleset's only other bypass actor. Idempotent: a run that stops after a
# release but before the index commit is completed by the next run (or "Run
# workflow"), which reuses the release asset.

on:
  push:
    branches: [main]
    # The index commit touches only index.json / publishers.json: it does not re-trigger this.
    paths: ["packages/**"]
  workflow_dispatch:

# Nothing by default; the App token carries the write access.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The hub's tooling, published from the OpenGroow repository. Bump when a manifest format changes.
      GROOWHUB_CLI: "@opengroow/groowhub-cli@0.1.0"
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          persist-credentials: true # pushes the index commit below
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the versions to release
        id: find
        run: |
          pending=$(node tools/pending-releases.mjs)
          echo "$pending"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Release them
        if: steps.find.outputs.pending != '[]'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PENDING: ${{ steps.find.outputs.pending }}
        run: |
          set -euo pipefail
          while read -r release; do
            dir=$(jq -r .dir <<<"$release")
            tag=$(jq -r .tag <<<"$release")
            index=$(jq -r .index <<<"$release")
            out="$RUNNER_TEMP/dist/$tag"
            mkdir -p "$out"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::notice::$tag is already released: reusing its asset"
              gh release download "$tag" --pattern '*.tgz' --dir "$out"
            else
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
                echo "::error::The tag $tag exists without a release (tags cannot be deleted): bump the version of $dir"
                exit 1
              fi
              if [ "$index" = "publishers.json" ]; then
                npx --yes "$GROOWHUB_CLI" pack publisher "$dir" --out "$out"
              else
                npm pack "./$dir" --pack-destination "$out"
              fi
              file=$(ls "$out"/*.tgz)
              gh release create "$tag" "$file" --target "$GITHUB_SHA" --title "$tag" \
                --notes "Release asset: $(basename "$file")"
            fi
            file=$(ls "$out"/*.tgz)
            node tools/update-index.mjs --index "$index" --package "$dir" \
              --repository "$GITHUB_REPOSITORY" --tag "$tag" --file "$file"
            echo "$tag" >> "$RUNNER_TEMP/released"
          done < <(jq -c '.[]' <<<"$PENDING")

      - name: Commit the index
        if: steps.find.outputs.pending != '[]'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index.json publishers.json; then
            echo "The index already points at these releases"
            exit 0
          fi
          bot="${APP_SLUG}[bot]"
          id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${id}+${bot}@users.noreply.github.com"
          git add index.json publishers.json
          git commit -m "Release $(paste -sd ' ' "$RUNNER_TEMP/released")"
          # Another merge may have landed meanwhile: rebase the index commit on it.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::Could not push the index commit; run the workflow again (it reuses the releases)"
          exit 1
